# Local development services: database, mail catcher and file storage. Credentials are for local use only.
name: cv-builder

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: cv_builder
      POSTGRES_DB: cv_builder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cv_builder -d cv_builder']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Catches all outgoing emails (verification codes, password reset links). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  # S3-compatible object storage for uploaded files (avatars). Web console: http://localhost:9001
  # MinIO withdrew its official images (minio/minio, quay.io); Chainguard builds the same open-source
  # server and offers only the `latest` tag for free.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cv_builder
      MINIO_ROOT_PASSWORD: cv_builder_secret # at least 8 characters, MinIO refuses to start otherwise
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
