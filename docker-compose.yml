# Local development services: database and mail catcher. Credentials are for local use only.
name: cv-builder

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: cv_builder
      POSTGRES_DB: cv_builder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cv_builder -d cv_builder']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Catches all outgoing emails (verification codes, password reset links). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  postgres-data:
