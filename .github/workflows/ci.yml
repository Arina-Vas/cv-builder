name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder?schema=public
      # Chromium for CV PDF export is only needed by backend-integration
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

  # Test jobs live here, not in frontend.yml/backend.yml: those have path filters, and a required
  # check from a workflow that never started blocks the merge.
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_GRAPHQL_URL: ${{ vars.NEXT_PUBLIC_GRAPHQL_URL || 'http://localhost:4000/graphql' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter frontend

      # Fails on failing tests and on coverage below the thresholds in vitest.config.ts
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage
          retention-days: 14

      - name: Coverage summary comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Frontend
          working-directory: frontend

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder?schema=public
      # Unit tests mock puppeteer, so Chromium is not downloaded
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter backend

      # Fails on failing tests and on coverage below coverageThreshold in package.json
      - name: Test with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage
          retention-days: 14

      - name: Coverage summary comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Backend
          working-directory: backend

  # Real GraphQL requests against a real PostgreSQL (backend/test/*.int-spec.ts). Mail and S3 are
  # replaced by fakes in the tests, so only Postgres is needed; global-setup applies the migrations.
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cv_builder
          POSTGRES_PASSWORD: cv_builder
          # The tests refuse to run against a database whose name does not end with _test
          POSTGRES_DB: cv_builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_builder -d cv_builder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder_test?schema=public
      TEST_DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder_test?schema=public
      PUPPETEER_NO_SANDBOX: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter backend

      - name: Integration tests
        run: pnpm test:int
